.fl .dot{width:14px;align-self:stretch;min-height:40px;border-radius:8px;flex:none;border:2px solid var(--plum)}
.fl .nm{flex:1;min-width:0}.fl .nm b{display:block;font-size:16px}.fl .nm small{display:block;font-size:12px;line-height:1.3;opacity:.85}
.steps{display:flex;justify-content:space-around;gap:12px;margin-top:10px}.st{text-align:center}.st label{display:block;font-size:11px;font-weight:800;letter-spacing:.5px;margin-bottom:3px}
.sp{display:flex;align-items:center;gap:6px}
.sp button{width:34px;height:34px;border-radius:50%;border:2px solid var(--plum);background:var(--yellow);color:var(--plum);font:700 20px/1 sans-serif;cursor:pointer;padding:0}
.sp input{width:58px;text-align:center;border:2px solid var(--plum);border-radius:10px;height:34px;font:700 16px var(--body);color:var(--plum);padding:0}
input,select,textarea{font:inherit;color:var(--plum)}
input[type=number],select,.in{border:2px solid var(--plum);border-radius:12px;padding:8px 10px;font-size:16px;background:#fff;min-width:0}
textarea{width:100%;border:2px solid var(--plum);border-radius:12px;padding:10px;font-size:15px;min-height:96px}
.btn{border:2px solid var(--plum);border-radius:99px;background:#fff;color:var(--plum);font:800 14px var(--body);padding:11px 16px;cursor:pointer}
.btn.p{background:var(--pink);border-color:var(--pink);color:#fff;box-shadow:0 3px 0 var(--plum)}
.btn.y{background:var(--yellow)}.btn.sm{padding:7px 12px;font-size:13px}.btn.w{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.sb{justify-content:space-between}
.set{display:flex;gap:10px;flex-wrap:wrap}.set label{flex:1;min-width:140px;font-size:12px;font-weight:800}.set input{width:100%;margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:10px 0 0}.chk input{width:22px;height:22px;accent-color:var(--pink)}
.ban{border-radius:16px;padding:12px 14px;font-weight:800;font-size:14.5px;line-height:1.4;margin-bottom:12px}
.ban.ok{background:var(--yellow)}.ban.bad{background:var(--pink);color:#fff}.ban.idle{background:var(--pale)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:11px;letter-spacing:.5px;padding:4px 4px;border-bottom:2px solid var(--plum)}
td{padding:9px 4px;border-bottom:1px solid var(--tan);vertical-align:middle}td.n{text-align:right;white-space:nowrap}
.short{color:var(--red);font-weight:800}.good{color:#1c7a4a;font-weight:800}.dim{opacity:.45}
.tag{display:inline-block;background:var(--pale);border-radius:99px;padding:2px 9px;font-size:11px;font-weight:800}
.note{font-size:12px;font-style:italic;color:#8a3a5a;margin:2px 0 0}
.cap{font-size:12.5px;margin-top:4px;line-height:1.35}.fl .cap b{display:inline;font-size:inherit}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--plum);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
nav button{flex:1;border:0;background:none;color:#fff;font:800 12px var(--body);padding:6px 0;opacity:.7;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav button.on{opacity:1;color:var(--yellow)}nav button.on svg{stroke:var(--yellow)}
#modal{position:fixed;inset:0;background:rgba(58,12,36,.86);z-index:40;display:none;overflow-y:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 12px 30px}
#modal.on{display:block}.sheet{max-width:560px;margin:0 auto;background:#fff;border-radius:24px;padding:18px;box-shadow:0 5px 0 var(--pink)}
.sheet h2{font:26px var(--head);color:var(--pink);margin:0 0 8px}
.ri{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--tan);align-items:start}
.ri .l{font-size:12px;opacity:.7;margin-bottom:5px;word-break:break-word}.ri .f{display:flex;gap:6px;flex-wrap:wrap}
.ri select{max-width:100%;flex:1 1 150px}.ri input[type=number]{width:84px}
.ri .chkb{width:22px;height:22px;accent-color:var(--pink);margin-top:2px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--plum);color:#fff;padding:11px 18px;border-radius:99px;font-weight:800;font-size:14px;z-index:60;box-shadow:0 4px 0 var(--pink);max-width:92vw;text-align:center}
.prog{height:12px;border-radius:8px;background:var(--pale);overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--pink);width:0}
.ci{display:flex;gap:6px;align-items:center;margin:6px 0}.ci .nm{flex:1;min-width:0;font-size:14px;font-weight:700}
.ci input[type=number]{width:78px}.ci select{width:84px;padding:8px 4px}

function parseLine(raw){

/* ============ MODALS ============ */
function openEdit(id){ed=id;const have=S.stock[id]||0,s=unitFor(id,have);$("modal").innerHTML=`<div class="sheet"><h2>${esc(ING[id].n.toUpperCase())}</h2><p class="sub">In stock now: <b>${fmt(id,have)}</b></p><div class="row"><input type="number" step="any" min="0" id="eq" class="in" style="width:110px" value="${Math.round(s.q*100)/100}"><select id="eu" class="in">${unitOpts(id,s.u)}</select></div>
 <label class="chk"><input type="checkbox" id="eig" ${S.ign&&S.ign[id]?"checked":""}> Don't track this (I always have enough, e.g. salt)</label><div class="row" style="margin-top:14px"><button class="btn p" data-a="esave" data-m="set">Set stock to this</button><button class="btn y" data-a="esave" data-m="add">Add this</button><button class="btn" data-a="close">Cancel</button></div></div>`;$("modal").classList.add("on")}
const closeModal=()=>{$("modal").classList.remove("on");RC=null;render()};
function shopText(){const tn=planNeed();return"CinnaGrace shopping list\n"+Object.keys(tn).filter(k=>tn[k]>(S.stock[k]||0)+1e-6&&tn[k]>0).map(k=>{const sh=tn[k]-(S.stock[k]||0);return`- ${ING[k].n}: ${packs(k,sh)} x ${ING[k].pl} (short ${fmt(k,sh)})`}).join("\n")}
/* ============ EVENTS ============ */
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-t]");if(t&&t.closest("#tabs")){tab=t.dataset.t;render();window.scrollTo(0,0);return}
 const a=e.target.closest("[data-a]");if(!a)return;const d=a.dataset,act=d.a;
 if(act==="inc"||act==="dec"){const p=S.plan[d.f];p[d.k]=Math.max(0,p[d.k]+(act==="inc"?(d.k==="r"?1:12):-(d.k==="r"?1:12)));save();render()}
 else if(act==="bake"){const tn=planNeed();if(!confirm("Use these ingredients from your stock?"))return;const used={};for(const k in tn){used[k]=Math.min(S.stock[k]||0,tn[k]);S.stock[k]=Math.max(0,(S.stock[k]||0)-tn[k])}S.hist.unshift({d:new Date().toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}),used});S.hist=S.hist.slice(0,10);save();render();toast("Stock updated. See the Stock tab for what's left.")}
 else if(act==="undo"){e.preventDefault();const h=S.hist.shift();if(h){for(const k in h.used)S.stock[k]=(S.stock[k]||0)+h.used[k];save();render();toast("Last bake undone")}}
 else if(act==="goshop"){tab="shop";render();window.scrollTo(0,0)}
 else if(act==="edit")openEdit(d.i);
 else if(act==="esave"){const q=num($("eq").value),b=baseAmt(ed,q,$("eu").value);S.stock[ed]=d.m==="add"?(S.stock[ed]||0)+b:b;S.ign=S.ign||{};S.ign[ed]=$("eig").checked;save();closeModal();toast("Stock saved")}
 else if(act==="close")closeModal();
 else if(act==="clearstock"){if(confirm("Reset all stock to zero?")){S.stock={};save();render()}}
 else if(act==="receipt")openReceipt();
 else if(act==="rcread"){RC.text=$("rct").value;const r=parseReceipt(RC.text);RC.items=r.items;RC.un=r.un;RC.busy=r.items.length?"":"No ingredient lines recognised in that text.";RC.p=0;drawReceipt()}
 else if(act==="rcun"){RC.showUn=!RC.showUn;drawReceipt()}
 else if(act==="rcadd"){let n=0;[...RC.items,...RC.un].forEach(it=>{if(it.on&&it.id){const b=baseAmt(it.id,num(it.q),it.u);if(b>0){S.stock[it.id]=(S.stock[it.id]||0)+b;n++}}});save();closeModal();toast(n+" item"+(n===1?"":"s")+" added to stock")}
 else if(act==="copyshop"){const t=shopText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("List copied"),()=>toast("Couldn't copy, use Share"))}
 else if(act==="shareshop"){const t=shopText();if(navigator.share)navigator.share({text:t}).catch(()=>{});else toast("Sharing isn't available here, use Copy list")}
 else if(act==="resetrec"){if(confirm("Reset all recipes and settings to the original notes?")){S.comps=clone(DEFAULT_COMPS);S.flav=clone(DEFAULT_FLAV);S.set={yield:12,mpr:3,whole:S.set.whole};save();render()}}
});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
 if(t.id==="whole"){S.set.whole=t.checked;save();render();return}
 if(t.classList.contains("pin")){S.plan[d.f][d.k]=Math.floor(num(t.value));save();render();return}
 if(t.id==="sy"){S.set.yield=Math.max(1,num(t.value)||12);save();render();return}
 if(t.id==="sm"){S.set.mpr=Math.max(1,num(t.value)||3);save();render();return}
 if(d.a==="useC"){const l=S.flav[d.f],i=l.indexOf(d.c);if(t.checked&&i<0)l.push(d.c);if(!t.checked&&i>=0)l.splice(i,1);save();return}
 if(d.a==="serves"){S.comps[d.c].serves=num(t.value)||1;save();return}
 if(d.a==="itq"){const it=S.comps[d.c].items[+d.x];it.q=num(t.value);save();render();return}
 if(d.a==="itu"){S.comps[d.c].items[+d.x].u=t.value;save();return}
 if(d.r&&RC){const it=(d.l==="un"?RC.un:RC.items)[+d.x];if(d.r==="on")it.on=t.checked;else if(d.r==="q")it.q=t.value;else if(d.r==="u")it.u=t.value;else if(d.r==="id"){it.id=t.value;it.on=!!t.value;if(it.id){const s=unitFor(it.id,ING[it.id].pk);it.q=s.q;it.u=s.u}drawReceipt()}return}
 if(t.id==="rcf"&&t.files[0])scanPhoto(t.files[0]);
});
render();
</script></body></html>
